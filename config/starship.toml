# Starship prompt — clean two-line theme (Catppuccin Mocha)
add_newline = true
command_timeout = 1000

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"

[directory]
truncation_length = 3
style = "bold #89b4fa"

[git_branch]
symbol = " "
style = "bold #cba6f7"

[git_status]
style = "bold #f9e2af"

[nodejs]
symbol = " "

[python]
symbol = " "

[golang]
symbol = " "

[cmd_duration]
min_time = 2000
format = "took [$duration](bold #fab387) "
