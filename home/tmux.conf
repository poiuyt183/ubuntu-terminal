# ── Prefix ────────────────────────────────────────────────────────────────
# Ctrl-a is easier to reach than Ctrl-b. Press it twice to send a literal C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────
set -g mouse on                  # click panes/windows, drag borders, scroll
set -g base-index 1              # windows start at 1 (0 is far from the row)
setw -g pane-base-index 1
set -g renumber-windows on       # no gaps after closing a window
set -g history-limit 50000
set -sg escape-time 10           # don't lag on ESC (vim/neovim)
set -g focus-events on
set -g display-time 2000         # messages stay readable
set -g set-clipboard on

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# ── Splits ────────────────────────────────────────────────────────────────
# | and - are mnemonic; new pane opens in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (no prefix) ───────────────────────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix + hjkl works too
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize — repeatable, hold the key after the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind Space next-layout
bind z resize-pane -Z            # zoom pane fullscreen (toggle)
bind x kill-pane
bind X kill-window
bind S choose-tree -Zs           # jump between sessions

# ── Window navigation (no prefix) ─────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# ── Copy mode (vi keys) ───────────────────────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Yank to the system clipboard: pbcopy on macOS, xclip on X11.
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
}

# ── Appearance ────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color

set -g status-position top
set -g status-interval 5
# Catppuccin Mocha
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-left-length 30
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f38ba8]^A ,}%H:%M #[fg=#89b4fa]#h "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-format "#[fg=#a6adc8] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
